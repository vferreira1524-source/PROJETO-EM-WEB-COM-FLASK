{% extends 'admin/base.html' %}

{% block title %}Editar usuário | ETEBookHub{% endblock %}

{% block content %}

<div class="page-heading mb-4">
    <h1>Editar usuário</h1>
    <p>Atualize os dados da conta selecionada.</p>
</div>

<div class="row justify-content-center">
    <div class="col-xl-8 col-lg-9">

        <div class="card">
            <div class="card-body p-4">

                <form method="POST" autocomplete="off">

                    <div class="mb-3">
                        <label class="form-label">Nome completo</label>
                        <input
                            type="text"
                            name="nome"
                            class="form-control"
                            value="{{ request.form.get('nome', usuario['nome']) }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nome de usuário</label>
                        <input
                            type="text"
                            name="login"
                            class="form-control"
                            value="{{ request.form.get('login', usuario['login']) }}"
                            required
                        >
                    </div>

                    <hr>

                    <h6 class="fw-bold">Alterar senha</h6>

                    <p class="text-muted small">
                        Deixe os campos vazios para manter a senha atual.
                    </p>

                    <div class="mb-3">
                        <label class="form-label">Nova senha</label>
                        <input
                            type="password"
                            name="senha"
                            class="form-control"
                            minlength="6"
                            autocomplete="new-password"
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Confirmar nova senha</label>
                        <input
                            type="password"
                            name="confirmar_senha"
                            class="form-control"
                            minlength="6"
                            autocomplete="new-password"
                        >
                    </div>

                    <div class="d-flex justify-content-end gap-2">

                        <a href="{{ url_for('listarUsuarios') }}"
                           class="btn btn-light border">
                            Cancelar
                        </a>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>
                            Salvar alterações
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
