{% extends 'admin/base.html' %}
{% block title %}Editar livro | ETEBookHub{% endblock %}
{% block content %}
<div class="page-heading"><h1>Editar livro</h1><p>Atualize as informações deste item do acervo.</p></div>
<div class="row justify-content-center"><div class="col-xl-8"><div class="card"><div class="card-body p-4 p-lg-5">
<form method="POST">
  <div class="row g-3">
    <div class="col-12"><label for="titulo" class="form-label fw-semibold">Título do livro</label><input type="text" class="form-control" id="titulo" name="titulo" value="{{ livro['titulo'] }}" required></div>
    <div class="col-md-7"><label for="autor" class="form-label fw-semibold">Autor</label><input type="text" class="form-control" id="autor" name="autor" value="{{ livro['autor'] }}" required></div>
    <div class="col-md-5"><label for="categoria" class="form-label fw-semibold">Categoria</label><input type="text" class="form-control" id="categoria" name="categoria" value="{{ livro['categoria'] or '' }}"></div>
  </div>
  <div class="mt-4 p-3 rounded-3" style="background:#f8fafc"><small class="text-muted d-block mb-1">Status atual</small>{% if livro['status'] == 'disponivel' %}<span class="badge-soft badge-available">Disponível</span>{% else %}<span class="badge-soft badge-loaned">Emprestado</span>{% endif %}</div>
  <div class="d-flex gap-2 mt-4"><button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>Salvar alterações</button><a href="{{ url_for('listarLivros') }}" class="btn btn-light border px-4">Cancelar</a></div>
</form>
</div></div></div></div>
{% endblock %}
